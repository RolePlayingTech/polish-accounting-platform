services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev:container"
    environment:
      API_BASE_URL: http://127.0.0.1:4000
      HOST: 0.0.0.0
      PORT: 4000
      NEXT_TELEMETRY_DISABLED: '1'
    ports:
      - '127.0.0.1:3000:3000'
      - '127.0.0.1:4000:4000'
    volumes:
      - ./apps:/workspace/apps
      - ./packages:/workspace/packages
      - web_node_modules:/workspace/apps/web/node_modules
      - api_node_modules:/workspace/apps/api/node_modules
      - mcp_node_modules:/workspace/apps/mcp/node_modules
      - domain_node_modules:/workspace/packages/domain/node_modules
      - contracts_node_modules:/workspace/packages/contracts/node_modules
      - application_node_modules:/workspace/packages/application/node_modules
      - ui_node_modules:/workspace/packages/ui/node_modules
      - db_node_modules:/workspace/packages/db/node_modules

  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_DB: pap_local
      POSTGRES_PASSWORD: pap_local_only
      POSTGRES_USER: pap_local
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pap_local -d pap_local']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro

volumes:
  web_node_modules:
  api_node_modules:
  mcp_node_modules:
  domain_node_modules:
  contracts_node_modules:
  application_node_modules:
  ui_node_modules:
  db_node_modules:
  postgres_data:
